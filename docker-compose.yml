# Development shop with the plugin mounted.
#
#   docker compose up -d && ./bin/setup.sh      # WordPress + WooCommerce on http://localhost:8092 (admin: /wp-admin)
#   docker compose run --rm cli wp injellik status
#
# Back office: admin / admin
# From the containers, an API running on the host is reachable at http://host.docker.internal:<port>
name: injellik-woocommerce

services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: wordpress
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 5s
      retries: 40

  wordpress:
    image: wordpress:${WP_IMAGE:-php8.3-apache}
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
        define( 'WP_ENVIRONMENT_TYPE', 'local' );
    ports:
      - "${WP_PORT:-8092}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - wp:/var/www/html
      - ./injellik-recommendations:/var/www/html/wp-content/plugins/injellik-recommendations

  cli:
    image: wordpress:cli-php8.3
    profiles: ["cli"]
    user: "33:33"
    depends_on:
      - wordpress
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      HOME: /tmp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - wp:/var/www/html
      - ./injellik-recommendations:/var/www/html/wp-content/plugins/injellik-recommendations

volumes:
  db:
  wp:
